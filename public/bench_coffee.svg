<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Background -->
  <rect width="400" height="300" fill="#c22525"/>
  
  <!-- Yellow Star -->
  <path d="M330 40 L333 53 L345 53 L335 61 L338 74 L330 65 L322 74 L325 61 L315 53 L327 53 Z" fill="#e2a524"/>

  <!-- Table (Right Side) -->
  <path d="M220 180 L380 180 L360 270 L240 270 Z" fill="#84533c" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="280" y1="180" x2="280" y2="270" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="320" y1="180" x2="320" y2="270" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Bench (Left Side) -->
  <!-- Legs -->
  <line x1="60" y1="200" x2="40" y2="280" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
  <line x1="160" y1="200" x2="140" y2="280" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
  <line x1="75" y1="200" x2="90" y2="280" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
  <line x1="175" y1="200" x2="190" y2="280" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>

  <!-- Seat -->
  <rect x="40" y="190" width="160" height="15" rx="5" fill="#a06a42" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="40" y1="197" x2="200" y2="197" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Backrest Supports -->
  <path d="M50 190 L50 110" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
  <path d="M150 190 L150 110" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>

  <!-- Backrest Slats -->
  <rect x="35" y="115" width="140" height="20" rx="3" fill="#a06a42" stroke="#1a1a1a" stroke-width="3"/>
  <rect x="35" y="145" width="140" height="20" rx="3" fill="#a06a42" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Coffee Mug -->
  <path d="M275 140 C275 125 325 125 325 140 L320 180 C320 183 315 185 300 185 C285 185 280 183 280 180 Z" fill="#e8d5c4" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Mug Pattern -->
  <path d="M280 155 L320 155" stroke="#c22525" stroke-width="3"/>
  <path d="M280 165 L320 165" stroke="#e2a524" stroke-width="2"/>
  <!-- Handle -->
  <path d="M320 145 C335 145 335 170 320 170" fill="none" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Coffee Steam -->
  <path d="M295 125 Q290 115 295 105 T295 85" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M305 125 Q300 112 305 102 T305 80" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
</svg>
