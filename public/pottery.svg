<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Background Split -->
  <rect width="200" height="300" fill="#e2a524"/>
  <rect x="200" width="200" height="300" fill="#2b4c7e"/>

  <!-- Wheel Table -->
  <ellipse cx="200" cy="240" rx="140" ry="25" fill="#5c5a58" stroke="#1a1a1a" stroke-width="3"/>
  <ellipse cx="200" cy="250" rx="140" ry="25" fill="#3c3a38" stroke="#1a1a1a" stroke-width="3"/>
  <rect x="60" y="240" width="280" height="30" fill="#2c2a28" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Clay Pot -->
  <path d="M160 170 C160 120 240 120 240 170 C240 210 230 230 200 235 C170 230 160 210 160 170 Z" fill="#b06543" stroke="#1a1a1a" stroke-width="4"/>
  <!-- Pot Opening -->
  <ellipse cx="200" cy="165" rx="35" ry="10" fill="#8f4f30" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Hands -->
  <!-- Left Hand (shaping left side) -->
  <path d="M60 160 Q110 160 150 175 C155 177 150 185 140 183 Q110 175 60 180" fill="#e8cfa6" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <!-- Fingers details -->
  <path d="M142 173 C146 173 148 178 142 180" fill="#e8cfa6" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Right Hand (shaping right side) -->
  <path d="M340 160 Q290 160 250 175 C245 177 250 185 260 183 Q290 175 340 180" fill="#e8cfa6" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <!-- Fingers details -->
  <path d="M258 173 C254 173 252 178 258 180" fill="#e8cfa6" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Clay Texture lines -->
  <path d="M175 190 Q200 195 225 190" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M170 210 Q200 215 230 210" fill="none" stroke="#1a1a1a" stroke-width="2"/>
</svg>
